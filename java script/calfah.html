<html>
    <head>
        <title>
            tempertare convertion.....
        </title>
        <body>
            <script>
                var cel,fah,result;
                cel=Number(prompt("Enter the temperature in celcius : "))
                result=(cel*9/5)+32;
                alert("converted : "+result)


                fah=Number(prompt("Enter the temperature in fahrenheit : "))
                result=(fah-32)*5/9;
                alert("converted : "+result)
            </script>
        </body>
    </head>
</html>
